<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom UI – Glass Login</title>
<link rel="stylesheet" href="custom-ui.css"></head><body>
<!-- background blobs -->
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<!-- login / sign-up card -->
<div class="card">
<input type="radio" name="t" id="t1" checked><input type="radio" name="t" id="t2">
<h2>Skill Trade</h2><p class="s">Log in or sign up to swap skills</p>
<div class="tabs"><label for="t1">Log in</label><label for="t2">Sign up</label></div>
<div class="form login"><input type="email" placeholder="Email"><input type="password" placeholder="Password"><button>Log in</button></div>
<div class="form signup"><input type="text" placeholder="Full name"><input type="email" placeholder="Email"><input type="password" placeholder="Password"><button>Create account</button></div>
</div></body></html>
